name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # Mirrors the constraints declared in composer.json (^6.4|^7.0|^8.0).
        symfony: ['6.4.*', '7.4.*', '8.1.*']
        exclude:
          # Symfony 8.x requires PHP 8.4 or later.
          - php: '8.3'
            symfony: '8.1.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, redis
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "symfony/framework-bundle:${{ matrix.symfony }}" \
                         "symfony/dependency-injection:${{ matrix.symfony }}" \
                         "symfony/config:${{ matrix.symfony }}" \
                         "symfony/http-kernel:${{ matrix.symfony }}" \
                         "symfony/routing:${{ matrix.symfony }}" \
                         --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
        env:
          REDIS_HOST: 127.0.0.1

      - name: Run tests with coverage
        if: matrix.php == '8.4' && matrix.symfony == '8.1.*'
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          REDIS_HOST: 127.0.0.1

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4' && matrix.symfony == '8.1.*'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lowest-deps:
    name: Tests (lowest dependencies)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, redis
          tools: composer:v2

      # A bundle is installed against whatever its constraints allow, so the
      # floor of those constraints has to be exercised too: it is where an
      # accidentally-used newer API shows up.
      - name: Install lowest dependencies
        run: composer update --prefer-dist --prefer-lowest --no-interaction --no-progress

      - name: Run tests
        run: composer test
        env:
          REDIS_HOST: 127.0.0.1

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # ext-redis is required for PHPStan to resolve the \Redis class
          # referenced by RedisHealthCheck.
          extensions: mbstring, xml, ctype, iconv, redis
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # composer.lock is gitignored (this is a library), so the cache keys
          # off composer.json instead.
          key: ${{ runner.os }}-composer-quality-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-quality-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer phpstan

      - name: Check code style
        run: composer cs-check
